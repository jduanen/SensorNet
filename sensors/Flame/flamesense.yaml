substitutions:
  device_name: flamesense
  friendly_name: "Flame Sensor"
  comment: "UVTRON-R2868-based Flame Sensor"
  log_level: WARN
  # flame is detected when the average rate over the window reaches this (pulses/min)
  pulse_threshold: "20"
  # averaging window (seconds) for the pulse rate
  rate_window: "10"
  # how long "Flame Detected" stays on after the rate drops below threshold
  hold_time: 10s

esphome:
  name: ${device_name}

packages:
  wifi_ws_conf: github://jduanen/SensorNet/common/wifi_ws.yaml

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

sensor:
  # C10807 open-collector output: one ~10ms pulse per detection event
  - platform: pulse_counter
    id: uv_rate
    internal: true
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    update_interval: 1s
    # pulse_counter reports pulses/min per 1s sample; average over the window
    filters:
      - sliding_window_moving_average:
          window_size: ${rate_window}
          send_every: 1
    total:
      id: pulse_total
      name: "Flame Sense Pulses"
      filters:
        - delta: 1  # only publish when the count changes

  # HA-facing copy of the rate, rate-limited so it doesn't publish every second
  - platform: copy
    source_id: uv_rate
    name: "Flame Sense Pulse Rate"
    unit_of_measurement: "pulses/min"
    accuracy_decimals: 0
    filters:
      - or:
          - throttle: 60s
          - delta: 5

binary_sensor:
  - platform: template
    name: "Flame Detected"
    device_class: safety
    lambda: return id(uv_rate).state >= ${pulse_threshold};
    filters:
      - delayed_off: ${hold_time}
    on_press:
      - light.turn_on: flame_led
    on_release:
      - light.turn_off: flame_led

output:
  - platform: ledc
    id: led_pwm
    pin:
      number: GPIO4
      inverted: true
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: flame_led
    name: "Flame LED"
    output: led_pwm
    default_transition_length: 0s
